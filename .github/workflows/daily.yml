name: 每日自动更新 IPTV 源

on:
  schedule:
    # 每天凌晨 3:00 (UTC+8) = 19:00 UTC
    - cron: '0 19 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行合并脚本
        run: python3 merge.py

      - name: 检查是否有更新
        id: check
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: 提交并推送更新
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "iptv-bot"
          git config user.email "bot@localhost"
          git add output/
          git commit -m "每日更新 $(date '+%Y-%m-%d %H:%M')"
          git push
